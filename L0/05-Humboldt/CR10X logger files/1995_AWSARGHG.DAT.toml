logger_type = "CR10X"

[[array]]
id = 122
ncols = 17
column_header = ["ISWR", "OSWR", "NR", "TA1", "TA3", "TA4", "_", "_", "VW1", "VW2", "DW1", "P", "HW1", "HW2"]
[[array.run]]
row_from = 0
row_to = 262
start_year = 1995
note = "dated from the file name only (outside the C-level period)"

[calibration.ISWR]
scale_pos = 200
scale_neg = 200
add = 0
source = "CR1000 header (CR10X-era ISWR implied 200.0 agrees with header 200)"

[calibration.NR]
scale_pos = 9.29
scale_neg = 11.62
add = 0
source = "CR1000 header (CR10X-era ISWR implied 200.0 agrees with header 200)"

[calibration.OSWR]
scale_pos = 200
scale_neg = 200
add = 0
source = "CR1000 header (CR10X-era ISWR implied 200.0 agrees with header 200)"

[calibration.P]
scale_pos = 1
scale_neg = 1
add = 400
source = "implied by C-level (17 runs); the programs write P minus 400"

[calibration.TA3]
scale_pos = 1
scale_neg = 1
add = 0
source = "CR1000 header"

[calibration.TA4]
scale_pos = 1
scale_neg = 1
add = 0
source = "CR1000 header"


[[ignore_rows]]
start = "1900-01-01 00:00:00"
end = "1995-06-21 23:00:00"
reason = "records dated before the installation of the station (1995-06-22, location table)"
