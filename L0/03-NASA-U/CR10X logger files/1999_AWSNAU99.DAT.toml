logger_type = "CR10X"

[[array]]
id = 31
ncols = 17
column_header = ["ISWR", "OSWR", "NR", "TA1", "TA2", "RH1", "RH2", "VW1", "VW2", "DW1", "DW2", "P", "HW1", "HW2"]
[[array.run]]
row_from = 0
row_to = 8812
start_year = 1998

[calibration.ISWR]
scale_pos = 200
scale_neg = 200
add = 0
source = "documented: C-level factor over 4225 h in 1998-1999 (documented 200.0)"

[calibration.NR]
scale_pos = 80
scale_neg = 80
add = 0
source = "CR1000 header (CR10X-era ISWR implied 198.7 agrees with header 200)"

[calibration.OSWR]
scale_pos = 182
scale_neg = 182
add = 0
source = "182 (= 200 x 0.91): the Jason C-level OSWR is 2.53 times the former station default 71.918 for these 1997-99 files (summer albedo 0.31 -> 0.78 as in the C-level file)"

[calibration.P]
scale_pos = 1
scale_neg = 1
add = 400
source = "implied by C-level (8 runs); the programs write P minus 400"

[calibration.TA3]
scale_pos = 1.00048
scale_neg = 1.00048
add = 0
source = "CR1000 header"

[calibration.TA4]
scale_pos = 1.00048
scale_neg = 1.00048
add = 0
source = "CR1000 header"

