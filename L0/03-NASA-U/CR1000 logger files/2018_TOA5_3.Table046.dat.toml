scale = 200
add = 0

[calibration.ISWR_max]
scale = 200
add = 0

[calibration.ISWR_std]
scale = 200
add = 0

[calibration.OSWR]
scale = 198.641112
add = 0
source = "x0.934 (LiCor) x 2.76205 moved from metadata/adjustments: the raw OSWR gives a summer albedo of 0.32, with both factors 0.83-0.84"

