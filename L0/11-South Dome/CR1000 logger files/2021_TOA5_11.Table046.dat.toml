logger_type = "CR1000"

column_header = ["timestamp", "ISWR", "ISWR_max", "ISWR_std", "OSWR", "NR", "NR_std", "TA1", "TA1_max", "TA1_min", "TA2", "TA2_max", "TA2_min", "TA3", "TA4", "RH1", "RH2", "VW1", "VW1_max", "VW1_stdev", "VW2", "VW2_max", "VW2_stdev", "DW1", "DW2", "P", "HW1", "HW2", "V", "TA5", "TS1", "TS2", "TS3", "TS4", "TS5", "TS6", "TS7", "TS8", "TS9", "TS10"]

[calibration.ISWR]
scale = 62
add = 0

[calibration.ISWR_max]
scale = 62
add = 0

[calibration.ISWR_std]
scale = 62
add = 0

[calibration.OSWR]
scale = 67.985019
add = 0
source = "x0.934 moved from metadata/adjustments (LiCor offset, issue #89): the C-level OSWR is exactly 0.934 times the logger value in the overlap"

[calibration.NR]
scale_pos = 9.29
scale_neg = 11.7
add = 0

[calibration.NR_std]
scale_pos = 9.29
scale_neg = 11.7
add = 0

[calibration.P]
scale = 1
add = 400

[[swap_columns]]
variables = ["HW1", "HW2"]
start = "2006-07-20 22:00:00"
end = "2100-01-01 00:00:00"
reason = "South Dome: from 2006-07-20 22 UTC the two sonic rangers are read on each other's channel, HW1 is the upper one (HW1 above HW2 by 1.0 m in the logger and in the C-level file; the report of 2011-05-30 has W1 3.47 and W2 4.60, the L1 labels gave 4.81 and 3.86 before the swap and 3.86 and 4.81 after); same table for the C-level file in metadata/c_level_swaps.csv"
