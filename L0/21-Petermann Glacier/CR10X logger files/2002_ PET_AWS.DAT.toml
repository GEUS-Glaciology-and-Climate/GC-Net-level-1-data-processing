logger_type = "CR10X"

[[array]]
id = 212
ncols = 17
column_header = ["ISWR", "OSWR", "NR", "TA1", "TA2", "_", "_", "_", "_", "_", "_", "_", "_", "_"]
[[array.run]]
row_from = 0
row_to = 262
start_year = 2002
note = "dated from the file name only (outside the C-level period)"

[calibration.ISWR]
scale = 73.5
add = 0
source = "73.5 for ISWR and OSWR (same factor for the pair): the logger value x 0.394 of the former 186.45 / 188.95 / 187.5 / 186.8, which are 2.25 x too high: ISWR / CARRA ssrd (independent) = 2.0-2.5 in 2002-2006 with those scales and 0.89-0.98 with 73.5 (V11 holds 73.5 in 2002 only and 2.3 x CARRA in 2003-2006). The OSWR of the C-level file is x0.346 in 2002 and x0.97 after, neither supported: NR = a ISWR - b OSWR over 2003-2005 gives b/a = 1.03-1.18, i.e. the two pyranometers share their factor, and albedo then is 0.84-0.95 in April-May and 0.58-0.70 in June-August (ablation area). No document gives the Petermann Glacier pyranometer factors (T_calib_pet.dat of 2003 is not in the repository)"

[calibration.NR]
scale_pos = 9.35
scale_neg = 11.61
add = 0
source = "implied by C-level (4 runs); no station calibration in the repository"

[calibration.OSWR]
scale = 73.5
add = 0
source = "73.5 for ISWR and OSWR (same factor for the pair): the logger value x 0.394 of the former 186.45 / 188.95 / 187.5 / 186.8, which are 2.25 x too high: ISWR / CARRA ssrd (independent) = 2.0-2.5 in 2002-2006 with those scales and 0.89-0.98 with 73.5 (V11 holds 73.5 in 2002 only and 2.3 x CARRA in 2003-2006). The OSWR of the C-level file is x0.346 in 2002 and x0.97 after, neither supported: NR = a ISWR - b OSWR over 2003-2005 gives b/a = 1.03-1.18, i.e. the two pyranometers share their factor, and albedo then is 0.84-0.95 in April-May and 0.58-0.70 in June-August (ablation area). No document gives the Petermann Glacier pyranometer factors (T_calib_pet.dat of 2003 is not in the repository)"


