logger_type = "CR10X"

[[array]]
id = 4
ncols = 16
column_header = ["ISWR", "OSWR", "NR", "TA3", "TA4", "_", "_", "VW1", "VW2", "DW1", "P", "HW1", "HW2"]
[[array.run]]
row_from = 0
row_to = 3382
start_year = 1997
# 2026-11: was 1999. Daily pressure of the run matches CARRA sp 730 days earlier (r 0.989, against 0.03 with the old dating); ISWR cannot show a year error.

[calibration.ISWR]
scale_pos = 200
scale_neg = 200
add = 0
source = "differs: C-level factor over 2683 h in 1999-1999 (documented 77.0)"

[calibration.NR]
scale_pos = 8.95
scale_neg = 10.99
add = 0
source = "implied by C-level (5 runs); the CR1000-era header (77.0) is not the same radiometer"

[calibration.OSWR]
scale_pos = 186.8
scale_neg = 186.8
add = 0
source = "differs: C-level factor over 2665 h in 1999-1999 (documented 77.0)"

[calibration.P]
scale_pos = 1
scale_neg = 1
add = 400
source = "implied by C-level (8 runs); the programs write P minus 400"

[calibration.TA3]
scale_pos = 1
scale_neg = 1
add = 0
source = "implied by C-level"

[calibration.TA4]
scale_pos = 0.99995
scale_neg = 0.99995
add = 0
source = "implied by C-level"

