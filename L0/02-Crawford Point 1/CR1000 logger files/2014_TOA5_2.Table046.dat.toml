logger_type = "CR1000"

column_header = ["timestamp", "ISWR", "ISWR_max", "ISWR_std", "OSWR", "NR", "NR_std", "TA1", "TA1_max", "TA1_min", "TA2", "TA2_max", "TA2_min", "TA3", "TA4", "RH1", "RH2", "VW1", "VW1_max", "VW1_stdev", "VW2", "VW2_max", "VW2_stdev", "DW1", "DW2", "P", "HW1", "HW2", "V", "TA5", "TS1", "TS2", "TS3", "TS4", "TS5", "TS6", "TS7", "TS8", "TS9", "TS10"]

[calibration.ISWR]
scale = 200
add = 0

[calibration.ISWR_max]
scale = 200
add = 0

[calibration.ISWR_std]
scale = 200
add = 0

[calibration.OSWR]
scale = 186.8
add = 0
source = "x0.934 moved from metadata/adjustments (LiCor offset, issue #89): the C-level OSWR is exactly 0.934 times the logger value in the overlap"

[calibration.NR]
scale_pos = 9.43
scale_neg = 11.77
add = 0

[calibration.NR_std]
scale_pos = 9.43
scale_neg = 11.77
add = 0

[calibration.TA1]
scale = 1.00011
add = 0

[calibration.TA1_max]
scale = 1.00011
add = 0

[calibration.TA1_min]
scale = 1.00011
add = 0

[calibration.TA2]
scale = 1.00011
add = 0

[calibration.TA2_max]
scale = 1.00011
add = 0

[calibration.TA2_min]
scale = 1.00011
add = 0

[calibration.P]
scale = 1
add = 400

[[calibration_period]]
variable = "ISWR"
start = "2012-01-01 00:00:00"
end = "2100-01-01 00:00:00"
multiply = 0.934
reason = "Crawford Point 1: the radiation channels are swapped from 2012-01-01 (swap_with_OSWR in metadata/adjustments), so the OSWR sensor factor 0.934 (LiCor offset, issue #89) moves with the sensor to the ISWR channel"

[[calibration_period]]
variable = "OSWR"
start = "2012-01-01 00:00:00"
end = "2100-01-01 00:00:00"
multiply = 1.0706638
reason = "Crawford Point 1: the ISWR sensor is wired to the OSWR channel from 2012-01-01: the 0.934 of the OSWR scale above does not apply to it (1/0.934)"
